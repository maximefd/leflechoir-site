# Production sur le VPS, derrière Cloudflare Tunnel ([ADR 0013](docs/adr/0013-cible-hebergement-production.md)).
#
#   cp .env.production.example .env.production   # puis remplir les secrets (jamais versionné)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Aucun port n'est publié : cloudflared ouvre une connexion sortante vers Cloudflare, et le trafic des
# visiteurs arrive par elle jusqu'à l'API, sur le réseau interne. PostgreSQL n'est joignable que par l'API.
name: leflechoir

# Journaux : pilote journald de l'hôte, qui les efface au bout de 14 jours (MaxRetentionSec=14day,
# docs/PRODUCTION.md). Le journal d'accès contient l'adresse IP des visiteurs : la page de confidentialité
# annonce 14 jours. LOG_DRIVER=local pour essayer ce fichier sur une machine sans journald.
x-logging: &logging
  driver: ${LOG_DRIVER:-journald}

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Remplir .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Remplir .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?Remplir .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  api:
    build: ./backend
    # Une image par site (ADR 0033) : PROJET vient de server.sh, d'après deploy/sites/<site>.env
    image: ${PROJET:-leflechoir}-api:${RELEASE:-local}
    restart: unless-stopped
    # Réglages lus dans .env.production (modèle : .env.production.example), un par un : le jeton du tunnel
    # n'entre pas dans l'environnement de l'API
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Remplir .env.production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Remplir .env.production}
      # Le site (ADR 0017, 0018)
      SITE: ${SITE:-fr}
      SITE_LANG: ${SITE_LANG:-fr}
      SITE_NAME: ${SITE_NAME:-Le Fléchoir}
      CORS_ORIGINS: ${CORS_ORIGINS:?Remplir .env.production}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Remplir .env.production}
      FRONTEND_URL: ${FRONTEND_URL:?Remplir .env.production}
      # E-mails du compte, par Brevo (ADR 0014)
      MAIL_BACKEND: smtp
      MAIL_FROM: ${MAIL_FROM:?Remplir .env.production}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_STARTTLS: "true"
      SMTP_USER: ${SMTP_USER:?Remplir .env.production}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Remplir .env.production}
      # Alertes et bilan hebdomadaire (ADR 0022) : vide, rien ne part. Plafond d'envois par 24 heures : le
      # quota de Brevo est partagé avec les e-mails du compte
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      ALERT_DAILY_CAP: ${ALERT_DAILY_CAP:-10}
      # Suivi des erreurs (projet Sentry dans l'UE) : vide, rien n'est envoyé
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE: ${RELEASE:-local}
      LOG_FORMAT: json
      # Derrière le tunnel, toutes les connexions viennent de cloudflared : l'adresse du visiteur est
      # dans CF-Connecting-IP, que seul Cloudflare peut poser puisque l'API n'a aucun port ouvert
      CLIENT_IP_HEADER: CF-Connecting-IP
      # L'API ouverte (ADR 0032) : vide, fermée (ses routes répondent 503). L'auteur l'ouvre avec API_ENABLED=1
      API_ENABLED: ${API_ENABLED:-}
      # Le test de charge avant l'ouverture (docs/PRODUCTION.md) : 1, la file de l'API tourne, ses routes restent fermées
      API_RUNNER: ${API_RUNNER:-}
      # La clé du connecteur MCP (service mcp) : ses appels comptent pour l'assistant qui les relaie, pas pour une adresse
      API_RELAY_SECRET: ${API_RELAY_SECRET:-}
      TRUST_PROXY_HOPS: "0"
      # Capacité (ADR 0013) : deux générations à la fois, un worker de plus pour le reste
      GENERATION_MAX_CONCURRENT: ${GENERATION_MAX_CONCURRENT:-2}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Lexique curé livré avec l'application (#118) ; à défaut, le DELA complet de l'image
      LEXICON_PATH: ${LEXICON_PATH:-/lexicon/lexique_cure.csv}
      # Les chiffres de Google et Bing pour le poste de pilotage (ADR 0029) : vides, rien n'est relevé.
      # Le compte de service Google est un fichier, dans le dossier des secrets monté plus bas
      GSC_CREDENTIALS_FILE: ${GSC_CREDENTIALS_FILE:-}
      GSC_PROPERTY: ${GSC_PROPERTY:-}
      BING_WEBMASTER_API_KEY: ${BING_WEBMASTER_API_KEY:-}
      BING_SITE_URL: ${BING_SITE_URL:-}
    volumes:
      # Sur le serveur, LEXICON_DIR=/opt/leflechoir/lexicon : un dossier partagé par les versions (ADR 0019)
      - ${LEXICON_DIR:-./data/lexicon/build}:/lexicon:ro
      # Sur le serveur, SECRETS_DIR=/opt/leflechoir/secrets : la clé du compte de service Google (ADR 0029)
      - ${SECRETS_DIR:-./secrets}:/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Le premier démarrage charge le lexique (de l'ordre d'une minute sur le VPS)
      start_period: 120s
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Le connecteur MCP de l'API ouverte (ADR 0032) : sans lexique ni base, il appelle l'API sur le réseau interne.
  # Démarré par server.sh seulement si MCP_ALLOWED_HOSTS est rempli (profil « connecteur ») ; le tunnel route son
  # nom d'hôte public (mcp.leflechoir.fr) vers http://mcp:8080
  mcp:
    build: ./mcp
    image: ${PROJET:-leflechoir}-mcp:${RELEASE:-local}
    profiles: ["connecteur"]
    restart: unless-stopped
    environment:
      API_URL: http://api:5000
      # Obligatoires : le connecteur refuse de démarrer sans eux (un « :? » bloquerait aussi les sites sans connecteur)
      API_RELAY_SECRET: ${API_RELAY_SECRET:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      # Le jeton de vérification du domaine pour l'annuaire de ChatGPT (docs/ANNUAIRES.md) : vide, rien n'est servi
      OPENAI_APPS_CHALLENGE: ${OPENAI_APPS_CHALLENGE:-}
    # Un petit service : un pic d'appels ne prend pas la mémoire de l'API et du lexique
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Jeton du tunnel (tableau de bord Cloudflare : Zero Trust → Networks → Tunnels). Le nom d'hôte
      # public api.leflechoir.fr y pointe vers http://api:5000, et mcp.leflechoir.fr vers http://mcp:8080.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Remplir .env.production}
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
